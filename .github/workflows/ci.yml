name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build AnyBrief
        run: |
          xcodebuild build \
            -scheme AnyBrief \
            -project AnyBrief.xcodeproj \
            -destination platform=macOS \
            -derivedDataPath /private/tmp/anybrief-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Test AnyBrief
        run: |
          xcodebuild test \
            -scheme AnyBrief \
            -project AnyBrief.xcodeproj \
            -destination platform=macOS \
            -derivedDataPath /private/tmp/anybrief-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Test FluidAudio STT wrapper
        run: swift test --package-path STTCLI

      - name: Test whisper.cpp wrapper
        run: swift test --package-path WhisperSTTCLI
